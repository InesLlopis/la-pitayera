{% extends 'common/base.html' %}

{% comment %}UD4.2.c{% endcomment %}

{% block content %}
<div class="container">
    <h2>{% if object %}

        {{ titulo_actualizacion}}

        {% else %}

        {{ titulo_creacion }}

        {% endif %}
    </h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="submit" value="{{object|yesno:'Actualizar,Crear'}}">
        {% if object and url_borrado %}

        <a class="btn btn-danger" role="button" href="{% url url_borrado object.id %}">
            Eliminar
        </a>

        {% endif %}
    </form>
</div>

{% endblock %}
