{% extends "common/base_intranet.html" %}


{% block main_content %}
<h1>Detalle de la factura</h1>

<p>Cliente: {{ object.cliente }}</p>
<p>Nº Factura: {{ object.n_factura }}</p>
<p>Fecha: {{ object.fecha }}</p>
<p>Concepto: {{ object.concepto }}</p>
<p>Importe: {{ object.total }}</p>

<div>
    <a href="{% url 'factura_list' %}" class="btn btn-secondary">
        Volver
    </a>
    <a href="{% url 'factura_update' object.pk %}" class="btn btn-success">
        Actualizar
    </a>
</div>

{% endblock main_content %}
