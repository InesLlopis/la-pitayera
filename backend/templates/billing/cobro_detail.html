{% extends "common/base_intranet.html" %}


{% block main_content %}
<h1>Detalle del cobro</h1>

<p>Cliente: {{ object.factura.cliente }}</p>
<p>Factura: {{ object.factura }}</p>
<p>Fecha: {{ object.fecha }}</p>
<p>Importe: {{ object.importe }}</p>

<div>
    <a href="{% url 'cobro_list' %}" class="btn btn-secondary">
        Volver
    </a>
    <a href="{% url 'cobro_update' object.pk %}" class="btn btn-success">
        Actualizar
    </a>
</div>

{% endblock main_content %}
