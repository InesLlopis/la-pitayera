{% extends "common/base_intranet.html" %}


{% block main_content %}
<h1>Detalle del cliente</h1>

<p>Nombre: {{ object.nombre }}</p>
<p>Apellidos: {{ object.apellidos }}</p>
<p>NIF: {{ object.nif }}</p>
<p>Email: {{ object.email }}</p>

<div>
    <a href="{% url 'cliente_list' %}" class="btn btn-secondary">
        Volver
    </a>
    <a href="{% url 'cliente_update' object.pk %}" class="btn btn-success">
        Actualizar
    </a>
</div>

{% endblock main_content %}
