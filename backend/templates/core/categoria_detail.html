{% extends "common/base_intranet.html" %}

{% comment %} UD3.8.a {% endcomment %}


{% block main_content %}
<h1>Detalle de categoría</h1>

<p>Nombre: {{ object.nombre }}</p>
<p>Descripción: {{ object.descripcion }}</p>

<div>
    <a href="{% url 'categoria_list' %}" class="btn btn-secondary">
        Volver
    </a>
    <a href="{% url 'categoria_update' object.pk %}" class="btn btn-success">
        Actualizar
    </a>
</div>

{% endblock main_content %}
