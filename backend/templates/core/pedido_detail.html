{% extends "common/base_intranet.html" %}

{% comment %} UD3.8.a {% endcomment %}


{% block main_content %}
<h1>Detalle de pedido</h1>

<p>Cliente: {{ object.cliente }}</p>
<p>Nº de pedido: {{ object.n_pedido }}</p>
<p>Fecha: {{ object.fecha }}</p>
<p>Importe: {{ object.total }}</p>

<div>
    <a href="{% url 'pedido_list' %}" class="btn btn-secondary">
        Volver
    </a>
    <a href="{% url 'pedido_update' object.pk %}" class="btn btn-success">
        Actualizar
    </a>
</div>
{% endblock main_content %}
